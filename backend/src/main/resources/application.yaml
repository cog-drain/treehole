# Spring 通用配置
spring:
  profiles:
    active: dev
  application:
    name: treehole-backend
  cache:
    type: redis
    cache-names:
      - messagePage
      - messageTagPage
      - trendingTags
      - graphData
      - commentList
  sql:
    init:
      mode: never # 禁止启动时自动执行 SQL 脚本（防止 DROP TABLE）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /docs # 将默认的 /swagger-ui.html 改为更简洁的 /docs
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-config:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.treehole.controller

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 强制打印 SQL 日志
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 服务端口
server:
  port: ${BACKEND_PORT:24191}
  address: 0.0.0.0 # 显式绑定到所有网卡，增强代理稳定性

# 自定义上传配置
app:
  upload:
    path: ${UPLOAD_PATH:../storage/uploads/} # 默认指向根目录 storage/uploads/
    url-prefix: /uploads/ # HTTP 访问前缀

# AI 大模型配置映射
ai:
  zhipu:
    api-key: ${AI_API_KEY:YOUR_ZHIPU_API_KEY_HERE}

# 日志配置
logging:
  file:
    path: ${LOG_PATH:../storage/logs/}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
