services:
  db:
    image: mariadb:11
    container_name: treehole-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-treehole_secret_pw}
      MARIADB_DATABASE: ${DB_NAME:-treehole}
      MARIADB_USER: ${DB_USER:-treehole_user}
      MARIADB_PASSWORD: ${DB_USER_PASSWORD:-treehole_pass}
      TZ: Asia/Tokyo
    volumes:
      - db_data:/var/lib/mysql
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - treehole-net
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${DB_USER:-treehole_user}", "-p${DB_USER_PASSWORD:-treehole_pass}"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: treehole-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-24191}:24191"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - BACKEND_PORT=24191
      - LOG_PATH=/app/logs
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-treehole}
      - DB_USER=${DB_USER:-treehole_user}
      - DB_USER_PASSWORD=${DB_USER_PASSWORD:-treehole_pass}
      - AI_API_KEY=${AI_API_KEY:-YOUR_KEY}
    volumes:
      - ./storage/uploads:/app/uploads
      - ./storage/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - treehole-net

  frontend:
    build: ./frontend
    container_name: treehole-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - treehole-net

networks:
  treehole-net:
    driver: bridge

volumes:
  db_data:
